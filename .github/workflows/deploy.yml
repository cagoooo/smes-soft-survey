name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject Firebase config into data/config.js
        run: |
          set -e
          f=data/config.js
          sed -i "s|__FIREBASE_API_KEY__|${{ secrets.FB_API_KEY }}|g" "$f"
          sed -i "s|__FIREBASE_AUTH_DOMAIN__|${{ secrets.FB_AUTH_DOMAIN }}|g" "$f"
          sed -i "s|__FIREBASE_PROJECT_ID__|${{ secrets.FB_PROJECT_ID }}|g" "$f"
          sed -i "s|__FIREBASE_STORAGE_BUCKET__|${{ secrets.FB_STORAGE_BUCKET }}|g" "$f"
          sed -i "s|__FIREBASE_MESSAGING_SENDER_ID__|${{ secrets.FB_MSG_SENDER_ID }}|g" "$f"
          sed -i "s|__FIREBASE_APP_ID__|${{ secrets.FB_APP_ID }}|g" "$f"
          if grep -q '"__FIREBASE_' "$f"; then echo "❌ 仍有未注入的佔位字串"; exit 1; fi
          echo "✅ Firebase 設定已注入"

      - name: Cache-bust 資產版本（JS/CSS）
        run: |
          set -e
          V="${{ github.sha }}"
          sed -i "s/__VER__/$V/g" index.html admin.html official.html report.html sw.js
          echo "✅ 資產版本號 = $V"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
