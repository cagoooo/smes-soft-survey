<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>管理後台 · 需求統計｜石門國小數位軟體調查</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="hero">
  <div class="hero__inner">
    <p class="hero__school">桃園市龍潭區石門國民小學 · 教務處</p>
    <h1 class="hero__title" style="font-size:24px">📊 需求調查 · 管理後台</h1>
    <p class="hero__sub">完整填報名單與統計 · 僅供承辦人使用</p>
  </div>
</header>

<!-- 密碼閘 -->
<div id="gate" class="gate">
  <div class="gate__box card">
    <h2 class="gate__h">🔒 請輸入管理密碼</h2>
    <input id="gateInput" class="namebar__input" type="password" placeholder="管理密碼" />
    <button id="gateBtn" class="btn btn--submit" type="button" style="margin-top:12px">進入後台</button>
    <p id="gateMsg" class="submit-msg"></p>
    <p class="gate__note">此為輕量防護（避免學生誤入）。資料屬實名制內部調查。</p>
  </div>
</div>

<main class="wrap" id="panel" hidden>

  <div class="toolbar card" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between">
    <span id="dataMode" class="toolbar__count"></span>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button id="refreshBtn" class="btn btn--ghost" type="button">🔄 重新整理</button>
      <button id="csvSoft" class="btn btn--ghost" type="button">⬇️ 軟體彙總 CSV</button>
      <button id="csvTeacher" class="btn btn--ghost" type="button">⬇️ 老師明細 CSV</button>
    </div>
  </div>

  <!-- 總覽 -->
  <section class="block">
    <div class="stat-grid" id="statGrid"></div>
  </section>

  <!-- 統購 -->
  <section class="block">
    <div class="block__head">
      <span class="block__tag block__tag--buy">統購軟體</span>
      <h2 class="block__title">統購 3 套 · 需求數加總</h2>
    </div>
    <div class="card" id="tonggouStat"></div>
  </section>

  <!-- 自主排行（全部，前5標記） -->
  <section class="block">
    <div class="block__head">
      <span class="block__tag block__tag--rank">提報依據</span>
      <h2 class="block__title">自主需求軟體 · 需求排行（前 5 名提報教育局）</h2>
      <p class="block__desc">依勾選人數排序。🏅 標記為目前前 5 名。點軟體可展開需求老師名單。</p>
    </div>
    <div id="rankFull"></div>
  </section>

  <!-- 老師完整名單 -->
  <section class="block">
    <div class="block__head">
      <h2 class="block__title">老師填報完整名單</h2>
      <p class="block__desc" id="teacherCount"></p>
    </div>
    <div id="teacherList"></div>
  </section>

</main>

<footer class="site-credit">
  <p class="site-credit__org">桃園市龍潭區石門國民小學 · 教務處</p>
  <p>
    Made with <span class="site-credit__heart" aria-label="愛心">❤️</span> by
    <a href="https://www.smes.tyc.edu.tw/modules/tadnews/page.php?ncsn=11&nsn=16#a5"
       target="_blank" rel="noopener noreferrer" class="site-credit__author">阿凱老師</a>
  </p>
</footer>

<script src="data/config.js"></script>
<script src="admin.js"></script>
</body>
</html>
